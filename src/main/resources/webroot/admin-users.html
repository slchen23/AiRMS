<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>使用者管理 - AiRMS</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/adminlte-4.10.0/css/adminlte.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons-1.13.2/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/vendor/datatables-3.1.5/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
<div class="app-wrapper">
  <main class="app-main">
    <div class="app-content-header">
      <div class="container-fluid">
        <h3 class="mb-0">使用者管理</h3>
      </div>
    </div>
    <div class="app-content">
      <div class="container-fluid">
        <div class="card">
          <div class="card-header d-flex align-items-center">
            <h3 class="card-title mb-0">帳號列表</h3>
            <button type="button" class="btn btn-primary btn-sm ms-auto" id="add-user"><i class="bi bi-person-plus" aria-hidden="true"></i> 新增帳號</button>
          </div>
          <div class="card-body">
            <div id="users-alert"></div>
            <table id="users" class="table table-striped table-hover w-100">
              <thead>
                <tr><th>帳號</th><th>顯示名稱</th><th>角色</th><th>權限</th><th>狀態</th><th>到期日</th><th>最後登入</th><th>操作</th></tr>
              </thead>
            </table>
          </div>
        </div>

        <div class="modal fade" id="user-modal" tabindex="-1" aria-labelledby="user-modal-title" aria-hidden="true">
          <div class="modal-dialog">
            <form class="modal-content" id="user-form" novalidate>
              <div class="modal-header">
                <h5 class="modal-title" id="user-modal-title">新增帳號</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
              </div>
              <div class="modal-body">
                <div id="user-form-alert"></div>
                <div class="mb-3">
                  <label for="u-username" class="form-label">帳號</label>
                  <input type="text" class="form-control" id="u-username" maxlength="32" autocomplete="off" required>
                  <div class="form-text">3～32 個英數字，可含 . _ -；建立後不能修改。</div>
                </div>
                <div class="mb-3">
                  <label for="u-display" class="form-label">顯示名稱</label>
                  <input type="text" class="form-control" id="u-display" maxlength="40" autocomplete="off" required>
                </div>
                <div class="mb-3" id="u-password-group">
                  <label for="u-password" class="form-label">臨時密碼</label>
                  <input type="password" class="form-control" id="u-password" maxlength="128" autocomplete="new-password" required>
                  <div class="form-text" id="u-password-hint"></div>
                </div>
                <div class="mb-3">
                  <label for="u-role" class="form-label">角色</label>
                  <select class="form-select" id="u-role">
                    <option value="USER">一般使用者</option>
                    <option value="ADMIN">管理者（擁有全部權限）</option>
                  </select>
                </div>
                <fieldset class="mb-3" id="u-perms">
                  <legend class="form-label fs-6">功能權限</legend>
                </fieldset>
                <div class="row g-2 align-items-end">
                  <div class="col-sm-6">
                    <label for="u-expires" class="form-label">到期日（選填）</label>
                    <input type="date" class="form-control" id="u-expires">
                  </div>
                  <div class="col-sm-6">
                    <div class="form-check form-switch mb-2">
                      <input class="form-check-input" type="checkbox" role="switch" id="u-enabled" checked>
                      <label class="form-check-label" for="u-enabled">啟用</label>
                    </div>
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="submit" class="btn btn-primary" id="user-submit">儲存</button>
              </div>
            </form>
          </div>
        </div>

        <div class="modal fade" id="reset-modal" tabindex="-1" aria-labelledby="reset-modal-title" aria-hidden="true">
          <div class="modal-dialog">
            <form class="modal-content" id="reset-form" novalidate>
              <div class="modal-header">
                <h5 class="modal-title" id="reset-modal-title">重設密碼</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
              </div>
              <div class="modal-body">
                <div id="reset-form-alert"></div>
                <p id="reset-target"></p>
                <div class="mb-3">
                  <label for="r-password" class="form-label">新的臨時密碼</label>
                  <input type="password" class="form-control" id="r-password" maxlength="128" autocomplete="new-password" required>
                  <div class="form-text" id="r-password-hint"></div>
                </div>
                <p class="form-text mb-0">對方下次登入時必須改成自己的密碼；目前的登入會被登出。</p>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="submit" class="btn btn-warning" id="reset-submit">重設密碼</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script nonce="__CSP_NONCE__" src="/vendor/bootstrap-5.3.8/js/bootstrap.bundle.min.js"></script>
<script nonce="__CSP_NONCE__" src="/vendor/datatables-3.1.5/js/dataTables.min.js"></script>
<script nonce="__CSP_NONCE__" src="/vendor/datatables-3.1.5/js/dataTables.bootstrap5.min.js"></script>
<script nonce="__CSP_NONCE__" src="/vendor/adminlte-4.10.0/js/adminlte.min.js"></script>
<script nonce="__CSP_NONCE__" type="module" src="/js/admin-users.js"></script>
</body>
</html>
