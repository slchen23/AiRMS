<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>路網路段 - AiRMS</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/adminlte-4.10.0/css/adminlte.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons-1.13.2/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/vendor/datatables-3.1.5/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/network.css">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
<div class="app-wrapper">
  <main class="app-main sections-main">
    <div class="app-content-header">
      <div class="container-fluid">
        <h3 class="mb-0">路網路段</h3>
      </div>
    </div>
    <div class="app-content">
      <div class="container-fluid">
        <div id="sections-alert"></div>
        <div class="callout callout-info mb-3">
          <p class="mb-1">來源「路段交通資料」XML 的每一筆路段，依<strong>國道＋方向＋起訖里程</strong>自動畫到路線上；這一頁用來核對每一筆畫在圖上的哪裡。高公局重新切段時也會自動對上，這裡看得出新舊路段。</p>
          <p class="mb-0 small text-secondary">只能查看。速度分級門檻（全線統一，顏色固定）在「<a href="/admin-settings.html">系統設定</a> → 路段速度顏色」修改。
            目前分級：<span id="steps-text">—</span>；資料時間：<span id="feed-time">—</span></p>
        </div>
        <div class="row g-3 mb-3" id="summary"></div>
        <div id="issues"></div>

        <div class="card mb-3 section-map-card">
          <div class="card-header d-flex align-items-center gap-2 flex-wrap">
            <h3 class="card-title mb-0">路網圖</h3>
            <span class="small text-secondary" id="map-hint">點表格的一列，圖上會閃爍標出那一段；點圖上的路段，表格會跳到那一列。</span>
            <button type="button" class="btn btn-outline-secondary btn-sm ms-auto" id="reload"><i class="bi bi-arrow-clockwise" aria-hidden="true"></i> 重新整理</button>
          </div>
          <div class="card-body p-0 section-map">
            <svg id="network" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="路網路段位置圖"></svg>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <form class="row g-2 align-items-end" id="filters">
              <div class="col-auto">
                <label class="form-label small mb-1" for="f-freeway">國道</label>
                <select class="form-select form-select-sm" id="f-freeway">
                  <option value="">全部</option>
                  <option value="1">國1</option>
                  <option value="3">國3</option>
                </select>
              </div>
              <div class="col-auto">
                <label class="form-label small mb-1" for="f-dir">方向</label>
                <select class="form-select form-select-sm" id="f-dir">
                  <option value="">全部</option>
                  <option value="S">南下</option>
                  <option value="N">北上</option>
                </select>
              </div>
              <div class="col-auto">
                <div class="form-check mb-1">
                  <input class="form-check-input" type="checkbox" id="f-attention">
                  <label class="form-check-label" for="f-attention">只看需要注意的（不完整在圖上、最新資料沒有、沒有速度）</label>
                </div>
              </div>
            </form>
          </div>
          <div class="card-body">
            <table id="sections" class="table table-striped table-hover w-100">
              <thead>
                <tr><th>路線</th><th>路段（起點 → 終點）</th><th>里程</th><th>速度</th><th>流量</th><th>顏色</th><th>圖上</th><th>資料時間</th></tr>
              </thead>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script nonce="__CSP_NONCE__" src="/vendor/bootstrap-5.3.8/js/bootstrap.bundle.min.js"></script>
<script nonce="__CSP_NONCE__" src="/vendor/datatables-3.1.5/js/dataTables.min.js"></script>
<script nonce="__CSP_NONCE__" src="/vendor/datatables-3.1.5/js/dataTables.bootstrap5.min.js"></script>
<script nonce="__CSP_NONCE__" src="/vendor/adminlte-4.10.0/js/adminlte.min.js"></script>
<script nonce="__CSP_NONCE__" type="module" src="/js/admin-sections.js"></script>
</body>
</html>
